<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domi</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #fafafa; color: #18181b; }
      html.dark body { background: #09090b; color: #fafafa; }
    </style>
    <script>
      // 在首帧前应用已有主题缓存，避免开屏背景闪白。
      ;(function() {
        var mode = localStorage.getItem('domi-theme-mode') || 'dark'
        var style = localStorage.getItem('domi-theme-style')
        var html = document.documentElement

        if (mode === 'special' && style && style !== 'default') {
          html.classList.add('theme-' + style)
          if (style.endsWith('-dark')) html.classList.add('dark')
        } else if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          html.classList.add('dark')
        }
      })()
    </script>
    <link rel="stylesheet" href="./startup-splash.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Domi 正在启动">
      <div class="sp-swarm" aria-hidden="true">
        <div class="sp-swarm-in"><div class="sp-swarm-breathe" id="sp-dots"></div></div>
      </div>
      <div class="sp-rings" aria-hidden="true"></div>
      <div class="sp-wave" aria-hidden="true"></div>
      <!-- 首帧复用 Domi 自有字标轮廓，不等待 React 主界面。 -->
      <svg class="sp-word" aria-hidden="true" viewBox="0 0 409 104" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sp-word-outline" x="-10%" y="-10%" width="120%" height="120%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="expanded" />
            <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outline" />
            <feFlood flood-color="currentColor" flood-opacity="0.8" result="ink" />
            <feComposite in="ink" in2="outline" operator="in" />
          </filter>
        </defs>
        <image href="/assets/brand/domi-wordmark.png" x="0" y="0" width="409" height="104" filter="url(#sp-word-outline)" />
      </svg>
      <div class="sp-line" aria-hidden="true"></div>
    </div>
    <script>
      // Percho 开屏粒子的黄金角分布与收场节奏；主 bundle 前同步生成。
      ;(function() {
        var splash = document.getElementById('splash')
        if (new URLSearchParams(window.location.search).has('window')) {
          splash.remove()
          return
        }

        var swarm = document.getElementById('sp-dots')
        var dots = document.createDocumentFragment()
        for (var i = 1; i <= 64; i++) {
          var radius = 13.2 * Math.sqrt(i)
          var angle = i * 137.508 * Math.PI / 180
          var x = Math.round(radius * Math.cos(angle))
          var y = Math.round(radius * Math.sin(angle))
          var size = Math.max(3, 13.5 - radius * 0.1 + (i * 7 % 3) - 1)
          var opacity = Math.min(1, Math.max(0.35, 1.02 - radius * 0.0065))
          var dot = document.createElement('i')
          dot.className = 'sp-dot'
          dot.style.setProperty('--x', x + 'px')
          dot.style.setProperty('--y', y + 'px')
          dot.style.setProperty('--ex', Math.round(x * 3 + Math.cos(angle) * 1100) + 'px')
          dot.style.setProperty('--ey', Math.round(y * 3 + Math.sin(angle) * 1100) + 'px')
          dot.style.setProperty('--s', size.toFixed(1) + 'px')
          dot.style.setProperty('--o', opacity.toFixed(2))
          dot.style.setProperty('--t', (3.1 + (i * 13 % 37) / 10).toFixed(1) + 's')
          dot.style.setProperty('--dl', (-((i * 29) % 67) / 10).toFixed(1) + 's')
          dots.appendChild(dot)
        }
        swarm.appendChild(dots)

        var started = performance.now()
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var finished = false
        var fallback = window.setTimeout(finish, 4500)
        function finish() {
          if (finished) return
          finished = true
          window.clearTimeout(fallback)
          document.documentElement.setAttribute('data-app-ready', '')
          window.setTimeout(function() { splash.remove() }, reducedMotion ? 300 : 2400)
        }
        window.addEventListener('domi-app-ready', function() {
          if (finished) return
          window.setTimeout(finish, reducedMotion ? 0 : Math.max(0, 2500 - (performance.now() - started)))
        }, { once: true })
      })()
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
