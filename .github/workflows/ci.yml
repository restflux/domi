name: Domi CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: domi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows 必过
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 准备 Electron 测试运行时
        run: bunx install-electron

      - name: 运行 M0 改造模块测试
        run: >-
          bun test
          packages/shared/src/config/index.test.ts
          apps/cli/src/paths.test.ts
          apps/electron/src/main/lib/product-identity.test.ts
          apps/electron/src/main/lib/product-update-policy.test.ts

      - name: 对比全量测试基线
        env:
          # GitHub Windows 的默认 TEMP 可能是 8.3 短路径，而 realpath 会展开为长路径，
          # 造成 checkout 路径断言和锁归属判断出现系统性误报。
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run scripts/compare-test-baseline.ts

      - name: 构建 Electron
        run: bun run electron:build

      - name: 同步运行时依赖
        working-directory: apps/electron
        run: bun run sync:runtime-deps

      - name: Windows 未签名打包 smoke
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --win --x64 --publish never

      - name: Windows 打包产物启动 smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'domi-launch-smoke'
          $userData = Join-Path $smokeRoot 'user-data'
          $profile = Join-Path $smokeRoot 'profile'
          New-Item -ItemType Directory -Force -Path $userData, $profile | Out-Null
          $env:HOME = $profile
          $env:USERPROFILE = $profile
          $env:APPDATA = Join-Path $profile 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $profile 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null

          $exe = Join-Path $PWD 'apps/electron/out/win-unpacked/Domi.exe'
          if (-not (Test-Path $exe)) { throw "未找到打包产物: $exe" }

          $process = Start-Process -FilePath $exe -ArgumentList "--user-data-dir=$userData", '--disable-gpu', '--launch-smoke' -PassThru
          if (-not $process.WaitForExit(30000)) {
            & "$env:SystemRoot\System32\taskkill.exe" /PID $process.Id /T /F | Out-Null
            throw 'Domi renderer 在 30 秒内未进入 ready-to-show'
          }
          if ($process.ExitCode -ne 0) {
            throw "Domi 启动 smoke 失败，退出码: $($process.ExitCode)"
          }

  linux:
    name: Linux 必过
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

  macos-manual:
    name: macOS 手动兼容检查
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck
